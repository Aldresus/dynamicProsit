name: Code quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          # The design system lives on GitHub Packages; .npmrc reads this.
          GITHUB_TOKEN: ${{ github.token }}
      - run: bun run lint
      - run: bun run test
      - run: bun run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
